# Publishing an image moves responsibility for its CVEs here: weasyprint and
# poppler parse files strangers mailed you. These raise the PR; the lock file
# still has to be regenerated (see server/requirements.lock) before merging a
# Python bump.
version: 2
updates:
  - package-ecosystem: pip
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      python:
        patterns: ["*"]
    ignore:
      # mcp 2.0 moved the module structure and mcp.server.fastmcp disappeared;
      # the <2 pin is the fix for that, not an oversight. Removing it stops the
      # server from importing at all.
      - dependency-name: mcp
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # A base-image bump also needs server/requirements.lock regenerated against
    # the new Python, so these are reviewed rather than merged on sight.
    open-pull-requests-limit: 1

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
