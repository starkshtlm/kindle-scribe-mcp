name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The plugin version silently sat at 1.0.0 through four releases.
      # Keep the two manifests equal, and equal to the tag when one is pushed.
      - name: Versions agree
        run: |
          plugin=$(python3 -c 'import json;print(json.load(open("plugin/.claude-plugin/plugin.json"))["version"])')
          market=$(python3 -c 'import json;print(json.load(open(".claude-plugin/marketplace.json"))["plugins"][0]["version"])')
          echo "plugin.json=$plugin marketplace.json=$market ref=${GITHUB_REF#refs/tags/}"
          if [ "$plugin" != "$market" ]; then
            echo "::error::plugin.json ($plugin) and marketplace.json ($market) disagree"
            exit 1
          fi
          case "$GITHUB_REF" in
            refs/tags/v*)
              if [ "v$plugin" != "${GITHUB_REF#refs/tags/}" ]; then
                echo "::error::tag ${GITHUB_REF#refs/tags/} does not match manifest version v$plugin"
                exit 1
              fi
              ;;
          esac

      - name: Security regression tests (inbound trust boundary)
        run: |
          python3 -m pip install --quiet -r server/requirements.txt pytest
          python3 -m pytest server/test_security.py -q

      - name: Build image
        run: docker build -t kindle-scribe-mcp:ci .

      - name: Start container in mailbox mode (no Resend credentials at all)
        run: |
          docker run -d --name mailbox-bridge -p 127.0.0.1:8378:8377 \
            -e MAIL_TRANSPORT=mailbox \
            -e KINDLE_EMAIL=ci@kindle.com \
            -e RETURN_EMAIL=ci@example.com \
            -e BRIDGE_TOKEN=citoken \
            -e SMTP_HOST=smtp.example.com -e SMTP_USER=ci@example.com \
            -e SMTP_PASSWORD=x -e IMAP_HOST=imap.example.com \
            kindle-scribe-mcp:ci
          sleep 8
          docker logs mailbox-bridge
          docker ps --filter name=mailbox-bridge --filter status=running \
            --format '{{.Names}}' | grep -q mailbox-bridge
          # The webhook is a door this deployment does not use; nothing should
          # be able to push documents in through it.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://127.0.0.1:8378/webhook/inbound -d '{}')
          test "$code" = "404"
          # The status endpoint is the diagnosis path; it must not be readable
          # without the token, and must say the mailbox never connected.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8378/status)
          test "$code" = "401"
          curl -sf -H 'Authorization: Bearer citoken' \
            http://127.0.0.1:8378/status | grep -q '"ever_connected":false'
          docker rm -f mailbox-bridge

      - name: Start container in hybrid mode (SMTP out, Resend webhook in)
        run: |
          docker run -d --name hybrid-bridge \
            -e MAIL_OUT=smtp -e MAIL_IN=resend \
            -e KINDLE_EMAIL=ci@kindle.com \
            -e RETURN_EMAIL=scribe@cool-hedgehog.resend.app \
            -e BRIDGE_TOKEN=citoken \
            -e RESEND_API_KEY=re_ci_placeholder \
            -e SMTP_HOST=smtp.example.com -e SMTP_USER=ci@example.com \
            -e SMTP_PASSWORD=x \
            kindle-scribe-mcp:ci
          sleep 8
          docker logs hybrid-bridge
          docker ps --filter name=hybrid-bridge --filter status=running \
            --format '{{.Names}}' | grep -q hybrid-bridge
          docker rm -f hybrid-bridge

      - name: Start container
        run: |
          docker run -d --name bridge -p 127.0.0.1:8377:8377 \
            -e RESEND_API_KEY=re_ci_placeholder \
            -e KINDLE_EMAIL=ci@kindle.com \
            -e FROM_EMAIL=ci@example.com \
            -e BRIDGE_TOKEN=citoken \
            -e MCP_TOKEN=cimcptoken \
            -e MCP_ALLOWED_HOSTS='*' \
            kindle-scribe-mcp:ci
          for i in $(seq 30); do
            curl -sf http://127.0.0.1:8377/healthz && break || sleep 1
          done

      - name: Health endpoint reports MCP enabled
        run: curl -sf http://127.0.0.1:8377/healthz | grep -q '"mcp":true'

      - name: MCP endpoint lists every tool
        run: |
          names=$(curl -sf -X POST http://127.0.0.1:8377/cimcptoken/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            | python3 -c 'import sys,json;print(",".join(sorted(t["name"] for t in json.load(sys.stdin)["result"]["tools"])))')
          echo "tools: $names"
          test "$names" = "ack_annotated,get_annotated,list_annotated,push_summary,send_to_scribe"

      - name: Secret path is required
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://127.0.0.1:8377/wrong-token/mcp -d '{}')
          test "$code" = "404"

      - name: PDF toolchain present in image
        run: |
          docker exec bridge weasyprint --version
          docker exec bridge pdftoppm -v

      - name: Container logs on failure
        if: failure()
        run: docker logs bridge
