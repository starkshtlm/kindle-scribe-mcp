name: Release

# Publishes the image a tag refers to, so installing does not mean compiling
# weasyprint and poppler on someone's laptop. Runs only for tags: main is
# covered by CI, and an image is only worth publishing once it has a version.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write
  id-token: write        # provenance attestation
  attestations: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The tag is what users will pull; if the manifests disagree with it the
      # plugin and the image would ship different versions of the same release.
      - name: Tag matches the manifests
        run: |
          tag=${GITHUB_REF#refs/tags/}
          plugin=$(python3 -c 'import json;print(json.load(open("plugin/.claude-plugin/plugin.json"))["version"])')
          market=$(python3 -c 'import json;print(json.load(open(".claude-plugin/marketplace.json"))["plugins"][0]["version"])')
          compose=$(sed -n 's|.*kindle-scribe-mcp:\${SCRIBE_VERSION:-\(v[0-9.]*\)}.*|\1|p' docker-compose.yml)
          echo "tag=$tag plugin=$plugin marketplace=$market compose-default=$compose"
          test "v$plugin" = "$tag"
          test "v$market" = "$tag"
          # A compose default pointing at a version that was never published
          # gives every new user "manifest unknown" as their first experience.
          test "$compose" = "$tag"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest

      # amd64 first so the smoke test below can run it on this runner; arm64 is
      # not decoration -- a Raspberry Pi or an Apple silicon host is exactly
      # where someone self-hosts this.
      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      - name: Smoke test the published image
        run: |
          digest=${{ steps.push.outputs.digest }}
          docker run -d --name published -p 127.0.0.1:8377:8377 \
            -e MAIL_TRANSPORT=mailbox \
            -e KINDLE_EMAIL=ci@kindle.com -e RETURN_EMAIL=ci@example.com \
            -e BRIDGE_TOKEN=citoken -e MCP_TOKEN=cimcptoken \
            -e MCP_ALLOWED_HOSTS='*' \
            -e SMTP_HOST=smtp.example.com -e SMTP_USER=ci@example.com \
            -e SMTP_PASSWORD=x -e IMAP_HOST=imap.example.com \
            "${IMAGE}@${digest}"
          for i in $(seq 30); do
            curl -sf http://127.0.0.1:8377/healthz && break || sleep 1
          done
          curl -sf http://127.0.0.1:8377/healthz | grep -q '"mcp":true'
          names=$(curl -sf -X POST http://127.0.0.1:8377/cimcptoken/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            | python3 -c 'import sys,json;print(",".join(sorted(t["name"] for t in json.load(sys.stdin)["result"]["tools"])))')
          test "$names" = "ack_annotated,get_annotated,list_annotated,push_summary,send_to_scribe"
          docker exec published weasyprint --version
          docker exec published pdftoppm -v
          docker rm -f published

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: |
          echo "### Published" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "digest: ${{ steps.push.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
