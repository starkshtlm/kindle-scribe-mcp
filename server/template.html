<meta charset="utf-8">
<title>{{TITLE}}</title>
<style>
  /* Sidformat 3:4 = Kindle Scribes skärmproportion, så sidan fyller skärmen
     utan letterboxing. Bred högermarginal = skrivyta för pennan. */
  @page { size: 15.75cm 21cm; margin: 1.2cm 3.2cm 1.4cm 1.2cm; }
  html { font-size: 10.5pt; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    line-height: 1.75;
    color: #000;
    margin: 0;
  }
  h1 { font-size: 1.5rem; line-height: 1.3; margin: 0 0 .3rem; }
  h2 { font-size: 1.15rem; margin: 1.6rem 0 .4rem; }
  h3 { font-size: 1rem; margin: 1.2rem 0 .3rem; }
  p { margin: 0 0 .8rem; }
  .meta {
    font-family: Helvetica, Arial, sans-serif;
    font-size: .75rem;
    color: #444;
    border-bottom: 1px solid #000;
    padding-bottom: .5rem;
    margin-bottom: 1.5rem;
  }
  ul, ol { padding-left: 1.3rem; }
  li { margin-bottom: .35rem; }
  code, pre {
    font-family: Menlo, monospace;
    font-size: .85em;
  }
  pre {
    border: 1px solid #999;
    padding: .6rem;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  blockquote {
    border-left: 2px solid #000;
    margin: .8rem 0;
    padding: .1rem 0 .1rem .8rem;
    color: #222;
  }
  table { border-collapse: collapse; width: 100%; font-size: .9em; }
  th, td { border: 1px solid #666; padding: .3rem .5rem; text-align: left; }
  h2, h3 { page-break-after: avoid; }
  pre, blockquote, table { page-break-inside: avoid; }
</style>
<div class="meta">{{META}}</div>
<h1>{{TITLE}}</h1>
{{BODY}}
